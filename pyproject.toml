[project]
name = "brickbuilder-mcp"
version = "0.1.0"
description = "MCP server that lets Claude design LEGO models and export them as LDraw files for Mecabricks"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2,<3",
    "numpy>=1.26",
    "pillow>=10",
]

[project.scripts]
brickbuilder-mcp = "brickbuilder.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brickbuilder"]
